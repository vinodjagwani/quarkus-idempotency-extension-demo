quarkus.flyway.migrate-at-start=true

# Distributed store: survives restarts and is shared by every instance. Table is in db/migration.
quarkus.idempotency.store=jdbc
# A write API must not silently run without a key.
quarkus.idempotency.require-key=true
# Keyed requests need an authenticated caller in a real deployment; the demo is anonymous.
quarkus.idempotency.require-identity=false
quarkus.idempotency.response-ttl=24h
# Must be above the worst-case handler latency.
quarkus.idempotency.lock-ttl=60s

# Simulated payment-gateway latency (this is what makes clients time out and retry).
demo.payment-delay=PT0S
%test.demo.payment-delay=PT0.4S
